name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: test -z "$ORVYN_REPO_TOKEN" || git config --global url."https://x-access-token:$ORVYN_REPO_TOKEN@github.com/".insteadOf "https://github.com/"
        env:
          ORVYN_REPO_TOKEN: ${{ secrets.ORVYN_REPO_TOKEN }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      - run: cargo test --workspace
