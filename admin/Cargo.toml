[package]
name = "orvyn-admin"
version = "0.1.0"
description = "Orvyn's operator tool: API clients, holding agents, wallet checks, the Privy wallet policies, a local preview database, new migrations and the contracts' test fixtures."
edition = "2024"
license = "MIT"
repository = "https://github.com/OrvynOS/Core"
publish = false

[dependencies]
orvyn-core = { path = ".." }
anyhow = "1"
base64 = "0.22"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "json"] }
alloy = { version = "2", default-features = false, features = ["std", "sol-types", "providers", "provider-http", "reqwest-rustls-tls"] }
postgresql_embedded = { version = "0.22", features = ["tokio"] }
rand = "0.9"
hex = "0.4"
chrono = "0.4"
sha2 = "0.10"
